about_how_text:
  ar: هذا الموقع معرض رقمي لمنتجاتنا وليس متجرًا إلكترونيًا؛ لا بيع مباشر عبر الموقع. نتعامل مع الشركاء وعملاء الجملة مباشرة، فتواصلوا معنا للاستفسار عن أي منتج.
  en: This site is a digital showcase of our products, not an online shop; nothing is sold through it. We deal with partners and wholesale customers directly, so contact us about any product.
