about_title: {ar: أحلام القمر, en: Ahlam Alqamar}
about_lead:
  ar: شركة أحلام القمر للتجارة. نقدم تشكيلة متنوعة من المستلزمات المنزلية والتجارية، لتلبية احتياجات الشركاء وعملاء الجملة.
