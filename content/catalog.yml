# The catalogue. One entry per collection and per product model.
#
# Rules from the client's brief:
# - One image represents a product in every listing; other colours and
#   real-life photos appear only on the product's own page.
# - Show only information that was supplied. A product lists just the
#   fields it has; leave a field out rather than guess it.
# - No prices, no stock, no ratings.
#
# Images are paths under content/images/. The first image of a product is
# its main image. `label` names what the image shows (a colour or a view).
#
# A collection with `soon: true` has no products or photos yet: it shows
# as a "coming soon" card and gets no page. To launch it, add its photos,
# a `cover`, products, and remove `soon`.

collections:
  - slug: metal-beds
    name: {ar: الأسرّة المعدنية, en: Metal beds}
    summary:
      ar: أسرّة حديد مفردة وقابلة للطي للاستخدام المنزلي والتجاري.
      en: Single and folding iron beds for home and commercial use.
    cover: metal-beds/rt-m101/black.jpg

  - slug: bunk-beds
    name: {ar: الأسرّة المعدنية بطابقين, en: Metal bunk beds}
    summary:
      ar: أسرّة حديد بطابقين للاستخدام المنزلي والتجاري.
      en: Two-tier iron beds for home and commercial use.
    cover: bunk-beds/iron-bunk-bed/main.jpg

  - slug: bedding
    name: {ar: المفروشات, en: Bedding}
