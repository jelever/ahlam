      ar: أطقم شنط تخزين متداخلة للرحلات والعزب.
      en: Nesting storage bag sets for trips and camps.
    cover: camp-bags/chinese/main.jpg

  - slug: chairs
    name: {ar: الكراسي, en: Chairs}
    soon: true
  - slug: event-chairs
    name: {ar: كراسي المناسبات, en: Event chairs}
