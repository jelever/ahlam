      ar: طاولات بلاستيك دائرية ومربعة، صناعة وطنية.
      en: Round and square plastic tables, made in Saudi Arabia.
    cover: plastic-tables/round-table/beige.jpg

  - slug: camp-bags
    name: {ar: شنط العزبة, en: Camp bags}
